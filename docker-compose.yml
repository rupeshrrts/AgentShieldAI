version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agentshield-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AgentShieldDbPass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-agentshield_poc}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentshield -d agentshield_poc"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentshield-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://agentshield:AgentShieldDbPass2026!@db:5432/agentshield_poc
      SECRET_KEY: ${SECRET_KEY:-agentshield-super-secret-production-key-change-me-321}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: agentshield-dashboard
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
