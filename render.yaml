# Render Blueprint for the AgentShield backend (FastAPI). Render: New -> Blueprint -> pick this repository.
# The three frontends (dashboard/, admin-console/, website/) go on Vercel: see DEPLOY_STEPS.md.
# Values marked "sync: false" are asked for when the Blueprint is created; nothing secret is stored here.
services:
  - type: web
    name: agentshield-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore          # closest Render region to the Supabase database (ap-northeast-1)
    plan: free                 # free sleeps after ~15 min idle (browsers lock while it wakes); use "starter" for real users
    healthCheckPath: /health
    # One worker: replay protection for device sign-in and login lockouts are kept in process memory
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips=*
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: SECRET_KEY
        generateValue: true    # random, created once by Render; never change it (it would sign everyone out)
      - key: DATABASE_URL
        sync: false            # Supabase -> Connect -> connection pooler URI (with your database password)
      - key: PUBLIC_BASE_URL
        sync: false            # this service's address, e.g. https://agentshield-api.onrender.com
      - key: DASHBOARD_URL
        sync: false            # the portal's Vercel address, e.g. https://agentshield-app.vercel.app
      - key: ADMIN_CONSOLE_URL
        sync: false            # the console's Vercel address
      - key: ALLOWED_ORIGINS
        sync: false            # portal and console addresses, comma separated, no trailing slash
      - key: EXTENSION_PACKAGE_DIR
        value: /app/release/package   # built extension (backend/release/package), offered on the portal's Download page
