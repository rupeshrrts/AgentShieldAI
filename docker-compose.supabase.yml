version: '3.8'

# ==============================================================================
# AgentShield Production Compose — External Database (Supabase / AWS RDS / GCP)
# ==============================================================================
# Use this configuration when connecting to a managed PostgreSQL database.
# Only 2 containers are launched:
#   1. backend:   FastAPI application (multi-worker Uvicorn)
#   2. dashboard: Production React frontend served by hardened NGINX
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentshield-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env (e.g., Supabase postgresql:// URI)}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be configured in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      INITIAL_ORG_NAME: ${INITIAL_ORG_NAME:-Acme Corp}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      ADMIN_CONSOLE_URL: ${ADMIN_CONSOLE_URL:-}
      STAFF_MFA_KEY: ${STAFF_MFA_KEY:-}
      STAFF_TOKEN_HOURS: ${STAFF_TOKEN_HOURS:-8}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      COMPANY_SIGNUP_ENABLED: ${COMPANY_SIGNUP_ENABLED:-false}
      TRIAL_DAYS: ${TRIAL_DAYS:-30}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      CREDITS_DEVICE_LIMIT: ${CREDITS_DEVICE_LIMIT:-3}
      FREE_TIER_ENABLED: ${FREE_TIER_ENABLED:-true}
      REFERRAL_BONUS_CHECKS: ${REFERRAL_BONUS_CHECKS:-100}
      REFERRAL_MAX: ${REFERRAL_MAX:-10}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      BILLING_SELLER_NAME: ${BILLING_SELLER_NAME:-AgentShield}
      BILLING_SELLER_DETAILS: ${BILLING_SELLER_DETAILS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      CHROME_STORE_EXTENSION_ID: ${CHROME_STORE_EXTENSION_ID:-}
      EDGE_STORE_EXTENSION_ID: ${EDGE_STORE_EXTENSION_ID:-}
      # Built extension package (see INSTALL.md 1.4), offered for download in the portal
      EXTENSION_PACKAGE_DIR: /srv/agentshield-dist/package
    volumes:
      - ./dist-installer:/srv/agentshield-dist:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - agentshield-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: agentshield-dashboard
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - agentshield-network

networks:
  agentshield-network:
    driver: bridge
